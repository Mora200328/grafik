<style>
:root{color-scheme:light dark;--bg:light-dark(#f5f6f9,#151922);--surface:light-dark(#fff,#202530);--surface2:light-dark(#f5f6fa,#292f3b);--text:light-dark(#232839,#edf0f7);--muted:light-dark(#777f91,#a2aabc);--line:light-dark(#e5e8ef,#373e4c);--accent:#6558e8;--accentbg:light-dark(#efedff,#34304e);--danger:#c74753;--green:#18856e;--shadow:0 14px 50px #00000017}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;font-size:14px}button,input,select{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}.app{min-height:100vh;padding:22px;max-width:1500px;margin:0 auto}.topbar{display:flex;justify-content:space-between;align-items:center;gap:15px;flex-wrap:wrap;margin-bottom:22px}.brand{display:flex;align-items:center;gap:12px}.logo{width:44px;height:44px;border-radius:14px;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:800;font-size:22px}.brand h1{font-size:24px;letter-spacing:-.8px;margin:0}.sub{font-size:12px;color:var(--muted);margin-top:4px}.actions,.toolbar,.nav,.tabs,.buttonrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.btn{border:1px solid var(--line);background:var(--surface);color:var(--text);border-radius:10px;padding:10px 13px;font-weight:650;font-size:12px;display:inline-flex;align-items:center;justify-content:center;gap:7px}.btn.primary{background:var(--accent);color:white;border-color:var(--accent)}.btn.danger{color:var(--danger)}.btn:hover{filter:brightness(.98)}.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:21px}#stats{grid-template-columns:repeat(4,minmax(0,1fr))}.barrow.moneyrow{grid-template-columns:minmax(100px,1fr) 2fr minmax(74px,auto)}.ratehistory{display:flex;flex-direction:column;gap:8px;margin-top:9px}.rate-entry{display:flex;align-items:center;justify-content:space-between;gap:8px;border:1px solid var(--line);border-radius:9px;padding:9px 10px;font-size:12px}.rate-entry .muted{font-size:11px}.stat{background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:16px}.stat label{display:block;color:var(--muted);font-size:12px;margin-bottom:10px}.stat strong{display:block;font-size:26px;letter-spacing:-.7px}.stat small{display:block;color:var(--muted);font-size:11px;margin-top:5px}.tabs{gap:22px;border-bottom:1px solid var(--line);margin-bottom:17px;overflow:auto;flex-wrap:nowrap}.tab{padding:12px 2px 14px;border:0;border-bottom:2px solid transparent;background:none;color:var(--muted);font-weight:650;white-space:nowrap}.tab.active{color:var(--accent);border-color:var(--accent)}.layout{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:15px;align-items:start}.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;min-width:0}.panelhead{padding:15px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}.panel h2{margin:0;font-size:15px;font-weight:750;letter-spacing:-.2px}.muted{color:var(--muted)}.iconbtn{width:33px;height:33px;border:1px solid var(--line);border-radius:9px;background:var(--surface);color:var(--text);font-size:18px}.month{min-width:150px;text-align:center;font-weight:750;font-size:14px;text-transform:capitalize}.calpad{padding:0 11px 12px}.weekdays,.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}.weekday{text-align:center;padding:12px 2px;color:var(--muted);font-size:11px;font-weight:650}.day{position:relative;min-width:0;min-height:105px;padding:5px 4px;border-top:1px solid var(--line);border-left:1px solid var(--line);cursor:pointer}.day:nth-child(7n){border-right:1px solid var(--line)}.day.outside{background:var(--surface2);opacity:.52}.day.selected{background:var(--accentbg);box-shadow:inset 0 0 0 1px #8175ee}.daynum{width:24px;height:24px;display:grid;place-items:center;border-radius:7px;font-size:11px;margin-bottom:4px}.day.today .daynum{background:var(--accent);color:#fff;font-weight:750}.dayadd{float:right;background:none;border:0;color:var(--accent);padding:1px 3px;font-size:17px;opacity:0}.day:hover .dayadd{opacity:1}.shift-chip{display:block;text-align:left;width:100%;border:0;border-left:3px solid var(--c);background:var(--cb);color:var(--text);border-radius:4px;padding:4px;margin:3px 0;font-size:10px;line-height:1.35;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.shift-chip b{display:block;font-size:10px}.more{color:var(--muted);font-size:10px;padding:2px 3px}.side{display:flex;flex-direction:column;gap:14px}.sidebody{padding:13px 15px}.pill{font-size:10px;background:var(--surface2);color:var(--muted);border-radius:18px;padding:5px 8px;white-space:nowrap}.shift-item{padding:12px 0;border-bottom:1px solid var(--line)}.shift-item:last-child{border-bottom:0}.shift-time{color:var(--accent);font-size:12px;font-weight:750}.shift-person{font-weight:650;font-size:12px;margin-top:7px}.shift-meta{color:var(--muted);font-size:11px;margin-top:4px}.empty{padding:20px 8px;text-align:center;color:var(--muted);font-size:12px;line-height:1.65}.person{display:flex;align-items:center;gap:10px;padding:8px 0}.avatar{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;flex-shrink:0;font-size:11px;font-weight:800}.personinfo{min-width:0;flex:1}.personname{font-size:12px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.personrole{font-size:11px;color:var(--muted);margin-top:4px}.formfield{margin-bottom:14px}.formfield label{display:block;margin-bottom:6px;font-size:12px;font-weight:650;color:var(--muted)}.formfield input,.formfield select,.search{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:9px;background:var(--surface);color:var(--text);min-width:0}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.hint{font-size:11px;line-height:1.6;color:var(--muted);margin-top:10px}.workergrid{padding:14px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}.worker{border:1px solid var(--line);border-radius:12px;padding:14px;min-width:0}.workerhead{display:flex;align-items:center;gap:10px;margin-bottom:14px}.workerhead .personinfo{min-width:0}.workerbuttons{display:flex;gap:7px;flex-wrap:wrap}.small{padding:7px 9px;font-size:11px}.reportbody{padding:16px}.barrow{display:grid;grid-template-columns:minmax(100px,1fr) 2fr 45px;gap:9px;align-items:center;margin:14px 0;font-size:12px}.barbg{height:8px;background:var(--surface2);border-radius:9px;overflow:hidden}.barfill{height:100%;border-radius:9px;background:var(--accent)}.tablewrap{overflow:auto;margin-top:17px}table{border-collapse:collapse;width:100%;font-size:12px}th,td{padding:12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}th{background:var(--surface2);color:var(--muted);font-weight:650}.modalback{display:none;position:fixed;inset:0;z-index:1000;background:#11152199;align-items:center;justify-content:center;padding:15px}.modalback.open{display:flex}.modal{width:min(465px,100%);max-height:92vh;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:21px}.modalhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}.modalhead h2{margin:0;font-size:19px}.modalfoot{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-top:20px}.modalfoot .right{display:flex;gap:8px;margin-left:auto}.error{display:none;border-radius:8px;background:light-dark(#fff0f0,#47272d);color:var(--danger);padding:10px;font-size:12px;line-height:1.5;margin-bottom:13px}.toast{display:none;position:fixed;bottom:20px;right:20px;z-index:1200;max-width:90vw;background:light-dark(#222838,#fff);color:light-dark(#fff,#222838);padding:13px 16px;border-radius:11px;font-size:12px;box-shadow:var(--shadow)}.footer{padding:14px 2px 4px;font-size:11px;color:var(--muted);display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}.install-banner{display:none;background:var(--accentbg);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:14px;align-items:center;justify-content:space-between;gap:10px;font-size:12px}.install-banner.show{display:flex}
.cafe-switcher{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:-8px 0 18px}.cafe-choice.active{background:var(--accentbg);border-color:var(--accent);color:var(--accent)}.period-controls{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.period-controls select,.period-controls input{padding:9px 10px;border:1px solid var(--line);border-radius:9px;background:var(--surface);color:var(--text)}.report-range{color:var(--muted);font-size:12px;margin:8px 0 18px}.report-person{display:grid;grid-template-columns:minmax(120px,1fr) repeat(2,minmax(90px,.8fr));gap:10px;align-items:center;border-bottom:1px solid var(--line);padding:11px 0;font-size:12px}.report-person strong{display:block;font-size:14px;margin-top:4px}@media(max-width:560px){.report-person{grid-template-columns:minmax(100px,1fr) repeat(2,minmax(75px,.8fr));gap:5px;font-size:11px}.report-person strong{font-size:12px}}
@media(max-width:900px){.layout{grid-template-columns:minmax(0,1fr)}.side{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}.day{min-height:86px}.workergrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:560px){#stats{grid-template-columns:repeat(2,minmax(0,1fr))}.app{padding:12px}.topbar{margin-bottom:16px}.brand h1{font-size:21px}.logo{width:40px;height:40px}.stats{gap:7px;margin-bottom:17px}.stat{padding:11px}.stat label{font-size:10px}.stat strong{font-size:22px}.stat small{font-size:10px}.actions .btn{padding:9px 10px}.tabs{gap:18px}.panelhead{padding:12px}.calpad{padding:0 4px 7px}.day{min-height:59px;padding:3px 2px}.weekday{font-size:10px;padding:10px 0}.daynum{width:21px;height:21px;font-size:10px}.shift-chip{height:5px;margin:3px 0;padding:0;border-radius:3px;font-size:0}.shift-chip b{font-size:0}.more{font-size:9px;padding:0}.dayadd{opacity:1}.side{grid-template-columns:1fr}.workergrid{grid-template-columns:1fr}.month{min-width:122px;font-size:13px}.hint{font-size:10px}.formgrid{gap:8px}.modal{padding:16px}.reportbody{padding:11px}.barrow{grid-template-columns:minmax(80px,1fr) 1.2fr 40px;gap:6px}.footer{font-size:10px}}
</style>
<div class="app">
<header class="topbar"><div class="brand"><div class="logo">Г</div><div><h1>Графики</h1><div class="sub" id="cafeSubtitle">Планирование смен · Кофейня 1</div></div></div><div class="actions"><button class="btn" id="exportBtn">↓ Excel (.xlsx)</button><button class="btn primary" id="addShiftBtn">＋ Добавить смену</button></div></header>
<div class="cafe-switcher"><span class="muted">Точка:</span><button class="btn cafe-choice active" data-cafe="cafe1">Кофейня 1</button><button class="btn cafe-choice" data-cafe="cafe2">Кофейня 2</button><button class="btn small" id="renameCafe">Переименовать</button></div>
<div class="install-banner" id="installBanner"><span>Установите «Графики» на главный экран для быстрого доступа.</span><button class="btn small" id="installHelp">Как установить?</button></div>
<section class="stats" id="stats"></section>
<nav class="tabs"><button class="tab active" data-tab="calendar">▦　Календарь</button><button class="tab" data-tab="staff">♙　Сотрудники</button><button class="tab" data-tab="reports">▤　Зарплата и статистика</button></nav>
<main id="mainView"></main><div class="footer"><span>Графики · Для вашей кофейни</span><span>Данные сохраняются на этом устройстве</span></div>
</div>
<div class="modalback" id="modalBack"><div class="modal"><div class="modalhead"><h2 id="modalTitle">Новая смена</h2><button class="iconbtn" id="closeModal" aria-label="Закрыть">×</button></div><div id="modalBody"></div></div></div><div class="toast" id="toast"></div>
<script>
(()=>{
'use strict';
const $=id=>document.getElementById(id);const colors=[{fg:'#6859d9',bg:'light-dark(#efedff,#35304f)'},{fg:'#168b72',bg:'light-dark(#e1f6ef,#213f3a)'},{fg:'#c17c26',bg:'light-dark(#fff0db,#493723)'},{fg:'#337dc0',bg:'light-dark(#e3f0ff,#233b53)'},{fg:'#c45d80',bg:'light-dark(#ffebf2,#4a2939)'},{fg:'#788c3c',bg:'light-dark(#f0f4dc,#38402a)'}];
const dateNow=new Date();function day(y,m,d){return new Date(y,m,d,12)}function iso(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}function parse(s){const [y,m,d]=s.split('-').map(Number);return day(y,m-1,d)}function plus(d,n){const x=new Date(d);x.setDate(x.getDate()+n);return x}function monthTitle(d){return d.toLocaleDateString('ru-RU',{month:'long',year:'numeric'})}function dateTitle(s,opt){return parse(s).toLocaleDateString('ru-RU',opt||{day:'numeric',month:'long'})}function mins(t){const [h,m]=t.split(':').map(Number);return h*60+m}function hours(s){let end=mins(s.end),start=mins(s.start);return end>start?(end-start)/60:0}
function fmtNum(n){return Number(n||0).toLocaleString('ru-RU',{maximumFractionDigits:2})}
function money(n){return fmtNum(n)+' ₽'}
function payHistory(p){if(!p)return [];const a=Array.isArray(p.shiftPayHistory)?p.shiftPayHistory.filter(x=>x&&x.from&&Number.isFinite(Number(x.amount??x.pay??x.rate))&&Number(x.amount??x.pay??x.rate)>0).map(x=>({from:String(x.from),amount:Number(x.amount??x.pay??x.rate)})):[];return a.sort((x,y)=>x.from.localeCompare(y.from))}
function payAt(p,date){let active=null;payHistory(p).forEach(x=>{if(x.from<=date)active=x});return active?active.amount:null}
function currentPay(p){return payAt(p,iso(dateNow))}
function shiftWorkers(s){return [s.employeeId?{id:s.employeeId,kind:'Основной'}:null,s.traineeId?{id:s.traineeId,kind:'Обучение'}:null].filter(Boolean)}
function payroll(ss){let total=0,missing=0;ss.forEach(s=>shiftWorkers(s).forEach(w=>{const p=person(w.id),a=payAt(p,s.date);if(a===null)missing++;else total+=a}));return {total,missing}}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function initials(n){return String(n||'?').trim().split(/\s+/).slice(0,2).map(x=>x[0]||'').join('').toUpperCase()}
const STORAGE_KEY='grafiki-cafe-v1';let data={cafes:{cafe1:{name:'Кофейня 1',people:[],shifts:[]},cafe2:{name:'Кофейня 2',people:[],shifts:[]}}},activeCafe='cafe1',people=[],shifts=[];
try{const saved=JSON.parse(localStorage.getItem(STORAGE_KEY)||'null');if(saved&&saved.cafes&&typeof saved.cafes==='object'){data.cafes.cafe1={...data.cafes.cafe1,...(saved.cafes.cafe1||{})};data.cafes.cafe2={...data.cafes.cafe2,...(saved.cafes.cafe2||{})};activeCafe=saved.activeCafe==='cafe2'?'cafe2':'cafe1'}else if(saved&&Array.isArray(saved.people)&&Array.isArray(saved.shifts)){data.cafes.cafe1={name:'Кофейня 1',people:saved.people,shifts:saved.shifts};if(!localStorage.getItem('grafiki-cafe-v1-backup'))localStorage.setItem('grafiki-cafe-v1-backup',JSON.stringify(saved))}}catch(e){}
people=data.cafes[activeCafe].people||[];shifts=data.cafes[activeCafe].shifts||[];data.cafes[activeCafe].people=people;data.cafes[activeCafe].shifts=shifts;
let current=day(dateNow.getFullYear(),dateNow.getMonth(),1),selected=iso(dateNow),tab='calendar',editingShift=null,editingEmployee=null,toastTimer,reportMode='week',reportAnchor=iso(dateNow);
function save(){try{data.cafes[activeCafe]={...data.cafes[activeCafe],people,shifts};localStorage.setItem(STORAGE_KEY,JSON.stringify({version:3,activeCafe,cafes:data.cafes,people,shifts}))}catch(e){notify('Не удалось сохранить данные. Проверьте память браузера.')}}function cafeName(id){return data.cafes[id]?.name||(id==='cafe1'?'Кофейня 1':'Кофейня 2')}function loadCafe(id){save();activeCafe=id;people=data.cafes[id].people||[];shifts=data.cafes[id].shifts||[];current=day(dateNow.getFullYear(),dateNow.getMonth(),1);selected=iso(dateNow);render()}function person(id){return people.find(p=>p.id===id)}function color(p){return colors[(p?.color||0)%colors.length]}function thisMonth(){return shifts.filter(s=>s.date.slice(0,7)===iso(current).slice(0,7))}function notify(msg){$('toast').textContent=msg;$('toast').style.display='block';clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').style.display='none',2600)}
function renderStats(){const ss=thisMonth(),allHours=ss.reduce((n,s)=>n+hours(s)*(s.traineeId?2:1),0),pay=payroll(ss);$('stats').innerHTML=`<div class="stat"><label>Сотрудники</label><strong>${people.length}</strong><small>В команде</small></div><div class="stat"><label>Смены за месяц</label><strong>${ss.length}</strong><small>Рабочих интервалов</small></div><div class="stat"><label>Часы персонала</label><strong>${fmtNum(allHours)}</strong><small>С учётом обучения вдвоём</small></div><div class="stat"><label>Зарплата за месяц</label><strong>${money(pay.total)}</strong><small>${pay.missing?'Не задана оплата за '+pay.missing+' назнач.':'По оплате за смену'}</small></div>`}
function renderCafeSwitcher(){document.querySelectorAll('[data-cafe]').forEach(b=>{b.classList.toggle('active',b.dataset.cafe===activeCafe);b.textContent=cafeName(b.dataset.cafe)});$('cafeSubtitle').textContent='Планирование смен · '+cafeName(activeCafe)}
function render(){renderCafeSwitcher();renderStats();document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));if(tab==='calendar')renderCalendar();else if(tab==='staff')renderStaff();else renderReports()}
function renderCalendar(){const y=current.getFullYear(),m=current.getMonth(),offset=(day(y,m,1).getDay()+6)%7,start=plus(day(y,m,1),-offset),week=['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];let cells='';for(let i=0;i<42;i++){const d=plus(start,i),key=iso(d),outside=d.getMonth()!==m,arr=shifts.filter(s=>s.date===key).sort((a,b)=>a.start.localeCompare(b.start));cells+=`<div class="day ${outside?'outside':''} ${key===selected?'selected':''} ${key===iso(dateNow)?'today':''}" data-day="${key}"><button class="dayadd" data-addday="${key}" aria-label="Добавить смену">＋</button><div class="daynum">${d.getDate()}</div>${arr.slice(0,3).map(s=>{const p=person(s.employeeId),c=color(p);return `<button class="shift-chip" style="--c:${c.fg};--cb:${c.bg}" data-shift="${s.id}" title="${esc(p?.name||'Сотрудник')} ${s.start}–${s.end}"><b>${s.start}–${s.end}</b>${esc(p?.name||'Сотрудник')}${s.traineeId?' · обучение':''}</button>`}).join('')}${arr.length>3?`<div class="more">+ ещё ${arr.length-3}</div>`:''}</div>`}
const dayShifts=shifts.filter(s=>s.date===selected).sort((a,b)=>a.start.localeCompare(b.start));$('mainView').innerHTML=`<div class="layout"><section class="panel"><div class="panelhead"><div class="nav"><button class="iconbtn" id="prevMonth" aria-label="Предыдущий месяц">‹</button><div class="month">${esc(monthTitle(current))}</div><button class="iconbtn" id="nextMonth" aria-label="Следующий месяц">›</button></div><button class="btn small" id="goToday">Сегодня</button></div><div class="calpad"><div class="weekdays">${week.map(w=>`<div class="weekday">${w}</div>`).join('')}</div><div class="days">${cells}</div></div></section><aside class="side"><section class="panel"><div class="panelhead"><h2>${esc(dateTitle(selected,{weekday:'short',day:'numeric',month:'long'}))}</h2><span class="pill">${dayShifts.length} смен</span></div><div class="sidebody">${dayShifts.length?dayShifts.map(s=>{const p=person(s.employeeId),t=person(s.traineeId),c=color(p),r=payAt(p,s.date),rp=r,tr=payAt(t,s.date),rt=tr;return `<div class="shift-item"><div class="shift-time">${s.start} — ${s.end} · ${fmtNum(hours(s))} ч</div><div class="person"><div class="avatar" style="color:${c.fg};background:${c.bg}">${initials(p?.name)}</div><div class="personinfo"><div class="personname">${esc(p?.name||'Не указан')}</div><div class="personrole">${esc(p?.role||'')}</div></div></div><div class="shift-meta">Оплата за смену: ${r===null?'не задана':money(r)}</div>${t?`<div class="shift-meta">Обучение: ${esc(t.name)} · оплата за смену ${tr===null?'не задана':money(tr)}</div>`:''}<button class="btn small" data-edit="${s.id}" style="margin-top:8px">Изменить смену</button></div>`}).join(''):'<div class="empty">На этот день пока нет смен.<br>Добавьте сотрудника на нужные часы.</div>'}<button class="btn primary" id="addSelected" style="width:100%;margin-top:10px">＋ Добавить смену</button></div></section><section class="panel"><div class="panelhead"><h2>Команда</h2><span class="pill">${people.length}</span></div><div function colName(n){let s='';while(n){const r=(n-1)%26;s=String.fromCharCode(65+r)+s;n=Math.floor((n-1)/26)}return s}function xmlEsc(s){return String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&apos;')}function sheetXML(rows){return '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetData>'+rows.map((r,ri)=>'<row r="'+(ri+1)+'">'+r.map((v,ci)=>{const ref=colName(ci+1)+(ri+1);return typeof v==='number'?'<c r="'+ref+'"><v>'+v+'</v></c>':'<c r="'+ref+'" t="inlineStr"><is><t xml:space="preserve">'+xmlEsc(v)+'</t></is></c>'}).join('')+'</row>').join('')+'</sheetData><autoFilter ref="A1:'+colName(rows[0]?.length||1)+rows.length+'"/></worksheet>'}function crc32(bytes){let c=-1;for(let i=0;i<bytes.length;i++){c^=bytes[i];for(let j=0;j<8;j++)c=(c>>>1)^((c&1)?0xedb88320:0)}return(c^-1)>>>0}function zip(files){const enc=new TextEncoder(),local=[],central=[];let offset=0;function u16(v,o,n){v.setUint16(o,n,true)}function u32(v,o,n){v.setUint32(o,n>>>0,true)}for(const f of files){const name=enc.encode(f.name),body=enc.encode(f.content),crc=crc32(body),lh=new Uint8Array(30+name.length),lv=new DataView(lh.buffer);u32(lv,0,0x04034b50);u16(lv,4,20);u16(lv,6,0x0800);u16(lv,8,0);u16(lv,10,0);u16(lv,12,0x0021);u32(lv,14,crc);u32(lv,18,body.length);u32(lv,22,body.length);u16(lv,26,name.length);u16(lv,28,0);lh.set(name,30);local.push(lh,body);const ch=new Uint8Array(46+name.length),cv=new DataView(ch.buffer);u32(cv,0,0x02014b50);u16(cv,4,20);u16(cv,6,20);u16(cv,8,0x0800);u16(cv,10,0);u16(cv,12,0);u16(cv,14,0x0021);u32(cv,16,crc);u32(cv,20,body.length);u32(cv,24,body.length);u16(cv,28,name.length);u16(cv,30,0);u16(cv,32,0);u16(cv,34,0);u16(cv,36,0);u32(cv,38,0);u32(cv,42,offset);ch.set(name,46);central.push(ch);offset+=lh.length+body.length}const csize=central.reduce((n,x)=>n+x.length,0),end=new Uint8Array(22),ev=new DataView(end.buffer);u32(ev,0,0x06054b50);u16(ev,4,0);u16(ev,6,0);u16(ev,8,files.length);u16(ev,10,files.length);u32(ev,12,csize);u32(ev,16,offset);u16(ev,20,0);return new Blob([...local,...central,end],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'})}
function exportExcel(){const range=periodRange(reportMode,reportAnchor),ss=shifts.filter(s=>s.date>=range.start&&s.date<=range.end).slice().sort((a,b)=>a.date.localeCompare(b.date)||a.start.localeCompare(b.start));const rows=[['Кофейня',cafeName(activeCafe)],['Период',range.label],[],['Дата','Начало','Окончание','Сотрудник','Должность','Часы','Оплата за смену, ₽','Начислено, ₽','Назначение']];ss.forEach(s=>shiftWorkers(s).forEach(w=>{const p=person(w.id),amount=payAt(p,s.date);rows.push([s.date,s.start,s.end,p?.name||'',p?.role||'',hours(s),amount===null?'Не задана':amount,amount===null?'—':amount,w.kind])}));if(!ss.length)rows.push(['За выбранный период смен нет','','','','','','','','']);const files=[{name:'[Content_Types].xml',content:'<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/></Types>'},{name:'_rels/.rels',content:'<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>'},{name:'xl/workbook.xml',content:'<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets><sheet name="Анализ" sheetId="1" r:id="rId1"/></sheets></workbook>'},{name:'xl/_rels/workbook.xml.rels',content:'<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/></Relationships>'},{name:'xl/worksheets/sheet1.xml',content:sheetXML(rows)}];const blob=zip(files),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='grafiki-'+activeCafe+'-'+range.start+'-'+range.end+'.xlsx';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500);notify('Excel за выбранный период сформирован')}
